<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessando Orçamento - Studio Alex Dantas</title>
    <style>
        body {
            background-color: #0a0a0f;
            color: #e8e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(108, 92, 231, 0.2);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .text {
            font-size: 0.95rem;
            color: #8888a0;
        }
    </style>
</head>
<body>
    <div id="resolverData" data-codigo="{{ codigo_parcial }}" style="text-align: center;">
        <div class="spinner"></div>
        <p class="text">Carregando seu orçamento...</p>
    </div>
    <script>
        (function() {
            var hash = window.location.hash;
            var dataEl = document.getElementById('resolverData');
            var parcial = dataEl ? dataEl.getAttribute('data-codigo') : '';
            if (hash && hash.length > 0) {
                // Recupera o hash fragment e codifica
                var codigoCompleto = parcial + hash;
                window.location.replace('/orcamento/visualizar/' + encodeURIComponent(codigoCompleto));
            } else {
                // Não tem hash fragment, redireciona para login informando código inválido
                window.location.replace('/login');
            }
        })();
    </script>
</body>
</html>
